<div class="space-y-1">
  @for (category of (categoryService.categories$ | async); track category.id) {
    <a [routerLink]="['/']" [queryParams]="{ categoryId: category.id }" 
       routerLinkActive="bg-indigo-50/80 text-indigo-700 font-semibold" 
       class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100/80 transition-all cursor-pointer relative overflow-hidden">
      
      <!-- Category Color Indicator -->
      <span class="w-3 h-3 rounded-full flex-shrink-0 shadow-sm" [style.backgroundColor]="category.color"></span>
      
      <span class="truncate flex-1">{{ category.name }}</span>
      
      <!-- Actions (Visible on hover) -->
      <div class="hidden group-hover:flex items-center gap-1">
        <button (click)="editCategory(category, $event)" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-100 rounded-md transition-colors" title="Edit">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
        </button>
        <button (click)="deleteCategory(category.id, $event)" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-100 rounded-md transition-colors" title="Delete">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>
      </div>
    </a>
  } @empty {
    <div class="px-3 py-2 text-sm text-slate-400 italic">No categories yet.</div>
  }
</div>

<app-category-form></app-category-form>
