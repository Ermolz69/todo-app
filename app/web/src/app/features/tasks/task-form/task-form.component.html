@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="close()"></div>
    
    <!-- Modal -->
    <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-fade-in-up">
      <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <h3 class="text-lg font-semibold text-slate-800">{{ isEditing ? 'Edit Task' : 'New Task' }}</h3>
        <button (click)="close()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="p-6 space-y-5">
        @if (errorMessage) {
          <div class="rounded-xl bg-red-50 p-3 text-sm text-red-600 border border-red-100">
            {{ errorMessage }}
          </div>
        }
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
          <input type="text" formControlName="title" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50 focus:bg-white transition-colors" placeholder="What needs to be done?">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Description (Optional)</label>
          <textarea formControlName="description" rows="3" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-slate-50 focus:bg-white transition-colors resize-none" placeholder="Add some details..."></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
          <app-custom-select
            formControlName="categoryId"
            [options]="categoryOptions"
            placeholder="Select a category">
          </app-custom-select>
        </div>

        <div class="pt-4 flex gap-3">
          <button type="button" (click)="close()" class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 transition-colors">Cancel</button>
          <button type="submit" [disabled]="taskForm.invalid" class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors">
            {{ isEditing ? 'Save Changes' : 'Create Task' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
