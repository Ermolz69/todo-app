<aside class="h-full flex flex-col pt-6 pb-4">
  <div class="px-6 mb-8 flex items-center gap-3">
    <div class="w-8 h-8 bg-gradient-to-tr from-indigo-600 to-cyan-500 rounded-lg flex items-center justify-center shadow-md">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h1 class="text-xl font-bold tracking-tight text-slate-800">To-Do</h1>
  </div>

  <nav class="flex-1 px-4 space-y-1 overflow-y-auto">
    <!-- Static items for now, will be populated by Categories later -->
    <a routerLink="/" routerLinkActive="bg-indigo-50 text-indigo-700" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-100 transition-colors">
      <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
      </svg>
      All Tasks
    </a>
    
    <div class="mt-8 mb-4 flex items-center justify-between px-3">
      <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Categories</h3>
      <button (click)="openCategoryForm()" class="text-slate-400 hover:text-indigo-600 transition-colors" title="Add Category">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>
    
    <app-category-list #categoryList></app-category-list>
  </nav>
</aside>
